<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var t=localStorage.getItem('pp_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Passo a Passo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra fixa com abas (Empresa / Pessoal) e período (Tudo / Semana / Hoje);
   abaixo, lista ordenada por prioridade. Clicar numa tarefa "entra" nela: uma
   página inteira com as subtarefas em primeiro plano e os detalhes recolhidos. */
:root{
  --bg:#d6dde6; --surface:#ffffff; --sunken:#e4e9ef; --ink:#131c26; --muted:#4f5c6a; --line:#b4c0cd;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#e2e9fc;
  --hi:#b93020; --hi-soft:#fbe5e1; --mid:#8f5600; --mid-soft:#fbedd0; --lo:#35627f; --lo-soft:#e0ebf2;
  --ok:#1a7447; --ok-soft:#dbf0e4;
  --shadow:0 1px 2px rgba(22,32,43,.08),0 8px 20px rgba(22,32,43,.06);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f14; --surface:#232d3a; --sunken:#161d27; --ink:#eef2f6; --muted:#a6b2bf; --line:#3d4a5a;
    --accent:#86a5ff; --accent-ink:#0b1220; --accent-soft:#1c294a;
    --hi:#ff9484; --hi-soft:#3c1c17; --mid:#f0b552; --mid-soft:#38290f; --lo:#93bedb; --lo-soft:#162a38;
    --ok:#62d096; --ok-soft:#133423;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f14; --surface:#232d3a; --sunken:#161d27; --ink:#eef2f6; --muted:#a6b2bf; --line:#3d4a5a;
  --accent:#86a5ff; --accent-ink:#0b1220; --accent-soft:#1c294a;
  --hi:#ff9484; --hi-soft:#3c1c17; --mid:#f0b552; --mid-soft:#38290f; --lo:#93bedb; --lo-soft:#162a38;
  --ok:#62d096; --ok-soft:#133423;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:4px}
.brand i{font-style:normal;color:var(--accent)}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.grow{flex:1 1 0;min-width:0}
.me{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme{flex:none;width:34px;height:34px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:50%;font-size:16px;line-height:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--hi);border-color:var(--hi)}
.btn.ghost{background:transparent}

main{padding-block:16px 48px;padding-inline:16px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.notice{background:var(--mid-soft);color:var(--mid);border-radius:8px;padding:9px 12px;font-size:14px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.tools label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.stats{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 14px}
.stats b{color:var(--ink);font-weight:600}
.stats .late b{color:var(--hi)}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--sunken);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col-head h2{font-family:var(--display);font-size:15px;font-weight:700}
.col-head span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-head button{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.col-head button:hover{color:var(--accent)}
.col-empty{font-size:13px;color:var(--muted);padding:10px 4px}
.card{background:var(--surface);border-radius:9px;padding:11px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.card h3{font-size:15px;font-weight:600;overflow-wrap:anywhere;text-wrap:balance}
.done h3,.done .row-title{text-decoration:line-through;color:var(--muted)}
.next{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.next b{font-weight:600;color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog div{flex:1;height:5px;background:var(--sunken);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.p-alta{background:var(--hi-soft);color:var(--hi)}
.p-media{background:var(--mid-soft);color:var(--mid)}
.p-baixa{background:var(--lo-soft);color:var(--lo)}
.chip.late{background:var(--hi);color:var(--surface)}
.chip.today{background:var(--accent-soft);color:var(--accent)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.group{font-family:var(--display);font-size:14px;font-weight:700;color:var(--muted);margin-top:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);min-width:0}
.row-top{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start;gap:8px 10px;padding:10px 12px}
.day{display:flex;flex-direction:column;gap:6px;border-radius:10px;padding:6px;margin:-6px}
.day.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.row[draggable]{cursor:grab}
.today-btn{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tick{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;margin-top:1px;padding:0;color:var(--surface);font-size:13px;line-height:1}
.done .tick{background:var(--ok);border-color:var(--ok)}
.row-main{flex:1 1 200px;min-width:0;border:0;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:6px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.exp{flex:none;border:0;background:var(--sunken);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.steps{margin:0;padding:2px 12px 12px 46px;display:flex;flex-direction:column;gap:6px}
.steps li{padding-left:2px}
.steps li::marker{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.steps label{display:flex;gap:10px;align-items:center;cursor:pointer;overflow-wrap:anywhere}
.steps .cbx{margin-top:0}
.cbx{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border:2px solid var(--muted);border-radius:6px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer}
.cbx::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
.cbx:checked{background:var(--ok);border-color:var(--ok)}
.cbx:checked::after{opacity:1}
.steps .sd{text-decoration:line-through;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-family:var(--display);font-size:20px}
.empty p{color:var(--muted);max-width:46ch}

.scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);z-index:10}
.panel{position:fixed;inset:0;background:var(--bg);z-index:11;overflow-y:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.panel-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.det{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.det summary{cursor:pointer;font-weight:600}
.det summary span{font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.det-in{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.save{font-size:13px;color:var(--muted)}
.f-title{font-family:var(--display);font-size:22px;font-weight:700;width:100%;padding:9px 11px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fld select,.fld input,.fld textarea{font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);width:100%}
.fld textarea{min-height:84px;resize:vertical}
.sec h4{font-family:var(--display);font-size:16px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.sec h4 span{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.edit-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.edit-steps li{display:flex;align-items:center;gap:6px;counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 6px 5px 8px;min-width:0}
.edit-steps li::before{content:counter(s);width:18px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.edit-steps input[type=text]{flex:1;border-color:transparent;background:transparent;padding:6px}
.edit-steps input.sd{text-decoration:line-through;color:var(--muted)}
.mini{flex:none;border:0;background:transparent;color:var(--muted);width:28px;height:30px;border-radius:6px;padding:0}
.mini:hover{background:var(--sunken);color:var(--ink)}
.addstep{display:flex;gap:6px}
.addstep input{flex:1;padding:10px 11px}
.hint{font-size:13px;color:var(--muted)}
.panel-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start;padding-top:8px}

.dialog{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;
  background:var(--surface);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dialog h2{font-family:var(--display);font-size:22px}
.dialog p{color:var(--muted)}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.person input{flex:1}
.person .ask{flex:1;min-width:0;overflow-wrap:anywhere}
.pick{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--sunken);border-radius:9px;padding:10px 12px;font-weight:500;overflow-wrap:anywhere}
.pick[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dialog form{display:flex;gap:6px}
.dialog form.login{flex-direction:column;gap:12px}
.dialog form input{flex:1}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;max-width:calc(100% - 32px);font-size:14px}

.month{align-items:center}
.month button{font-size:17px;line-height:1;padding:5px 11px}
.month span{padding:0 8px;font-weight:600;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span,.tile small{font-size:13px;color:var(--muted)}
.tile b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--ok)}
.neg{color:var(--hi)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.cat>span:first-child{overflow-wrap:anywhere}
.cbar{grid-column:1/-1;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--hi);border-radius:3px}
.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;align-self:center}
.fin-list{display:flex;flex-direction:column;gap:6px}
.gen-tabs{align-self:flex-start}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.dchart{position:relative;display:flex;gap:2px;height:150px;margin-bottom:18px}
.dchart u{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.dcol{position:relative;flex:1 1 0;min-width:0;border:0;background:transparent;padding:0;border-radius:3px}
button.dcol:hover,.dcol.on{background:var(--sunken)}
.dcol i{position:absolute;left:50%;transform:translateX(-50%);width:min(100%,14px)}
.dcol i.pos{background:var(--ok);border-radius:4px 4px 0 0}
.dcol i.neg{background:var(--hi);border-radius:0 0 4px 4px}
.dcol em{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-style:normal;font-size:12px;color:var(--muted)}
.dpick b{font-weight:600;color:var(--ink)}
.catb{width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:4px;border-radius:6px}
.catb[aria-pressed="true"]{background:var(--accent-soft)}
.catb .cbar{display:block}
.box .group .hint{font-family:var(--body);font-weight:400}
.ledger{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ledger li+li{border-top:1px solid var(--line)}
.ledger button{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px}
.ledger button:hover{background:var(--sunken)}
.ld{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lt{display:flex;flex-direction:column;min-width:0}
.lt b{font-weight:500;overflow-wrap:anywhere}
.lt small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.offer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:11px 2px}
.offer:first-of-type{border-top:0}
.offer-name{font-weight:600;overflow-wrap:anywhere}
.offer-sub{grid-column:1/-1}
.cbar.pos i{background:var(--ok)}
.offer-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.offer-head h2{font-family:var(--display);font-size:22px;overflow-wrap:anywhere}
.tscroll{overflow-x:auto}
.days{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.days th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:4px 8px}
.days td{text-align:right;padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
.days th:first-child,.days td:first-child{text-align:left;padding-left:0}
.days td:last-child{font-weight:600}
.btn.sm{padding:5px 12px;font-size:13px}
.tpl-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tpl-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:500}
.tpl-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pick .hint{font-weight:400}
.dialog form.fin-form{flex-direction:column;gap:12px}
.fin-form .seg{align-self:flex-start}
.fin-form .panel-foot{padding-top:4px}
.per-seg{flex-wrap:wrap;max-width:100%}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;gap:6px;align-items:center}
.items input{flex:1 1 0;min-width:0}
.items input.iv{flex:0 0 120px}
@media (max-width:760px){
  .tiles,.tiles.six{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile b{font-size:18px}
  .days{font-size:13px}
  .days th,.days td{padding-left:4px;padding-right:4px}
  .board{grid-template-columns:minmax(0,1fr)}
  .stats{margin-left:0;width:100%}
  .fields{grid-template-columns:minmax(0,1fr)}
  .steps{padding-left:38px}
  .per-seg button{padding:6px 10px}
  .items input.iv{flex-basis:96px}
}
@media (prefers-reduced-motion:no-preference){.card,.row{transition:box-shadow .15s}}
</style>

<header class="bar" id="bar"></header>
<main id="app"></main>
<div id="sheet" hidden></div>
<div id="fin" hidden></div>
<div id="tplDlg" hidden></div>
<div id="team" hidden></div>
<div id="login" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const PRIO={alta:{l:'Alta',o:0},media:{l:'Média',o:1},baixa:{l:'Baixa',o:2}};
const STATUS=[['afazer','A fazer'],['feito','Feito']];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function ymdNow(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const S={remote:[],tasks:[],team:[],me:ls.get('pp_me')||'',tab:ls.get('pp_tab')||'empresa',view:ls.get('pp_view')||'quadro',
  period:['semana','hoje'].indexOf(ls.get('pp_period'))>=0?ls.get('pp_period'):'tudo',person:'',fPrio:'',fWho:'',fArea:'',expanded:new Set(),ready:false,teamReady:false,local:false,canWrite:true,draft:null,isNew:false,teamOpen:false,
  section:ls.get("pp_section")==="financas"?"financas":"tarefas",fin:[],finErr:false,month:ymdNow().slice(0,7),fCat:"",fOffer:"",dayPick:"",genView:["gastos","receitas"].indexOf(ls.get("pp_genview"))>=0?ls.get("pp_genview"):"painel",entry:null,finView:["ofertas","pessoal"].indexOf(ls.get("pp_finview"))>=0?ls.get("pp_finview"):"geral",
  finPer:["hoje","ontem","7d"].indexOf(ls.get("pp_finper"))>=0?ls.get("pp_finper"):"mes",pfin:[],pfinErr:false,pentry:null,email:"",pType:"",offers:[],offerErr:false,offerId:"",offerForm:null,tpl:[],tplErr:false,tplMode:false,tplOpen:false,tplDel:""};
let db=null;
const over={},pending={},inflight={};

/* ---------- dados ---------- */
function norm(t){
  return {id:t.id,title:t.title||'',desc:t.desc||'',scope:t.scope==='pessoal'?'pessoal':'equipe',area:t.area==='vida'?'vida':'trabalho',
    who:t.who||'',prio:PRIO[t.prio]?t.prio:'media',status:t.status==='feito'?'feito':'afazer',due:t.due||'',
    steps:Array.isArray(t.steps)?t.steps.map(s=>({id:s.id||uid('s'),text:s.text||'',done:!!s.done})):[],createdAt:t.createdAt||0,createdBy:t.createdBy||''};
}
function merge(){
  const m=new Map(S.remote.map(t=>[t.id,t]));
  for(const id in over){ if(over[id]===null) m.delete(id); else m.set(id,over[id]); }
  S.tasks=[...m.values()];
}
function persistLocal(){ ls.set('pp_tasks',JSON.stringify(S.remote)); ls.set('pp_team',JSON.stringify(S.team)); }
function onWriteErr(e){
  if(e&&(e.code==='42501'||e.code==='PGRST301'||e.status===401)) toast('Sua sessão expirou. Recarregue a página e entre de novo.');
  else toast('Não foi possível salvar. Confira a internet e tente de novo.');
}
const toRow=t=>({id:t.id,title:t.title,descr:t.desc,scope:t.scope,who:t.who,prio:t.prio,status:t.status,due:t.due||null,steps:t.steps,created_at:t.createdAt,created_by:t.createdBy});
const fromRow=r=>norm({id:r.id,title:r.title,desc:r.descr,scope:r.scope,who:r.who,prio:r.prio,status:r.status,due:r.due||'',steps:r.steps,createdAt:Number(r.created_at)||0,createdBy:r.created_by});
function push(id){
  if(inflight[id]) return;
  if(!(id in pending)){ delete over[id]; merge(); render(); return; }
  const body=pending[id]; delete pending[id]; inflight[id]=true;
  const q=body===null?db.from('tasks').delete().eq('id',id):db.from('tasks').upsert(toRow(Object.assign({id},body)));
  // Ao gravar com sucesso, a cópia do banco (S.remote) já recebe a mudança; sem isso a tela
  // voltava ao estado antigo por um instante, até a releitura chegar.
  const ok=()=>{ wrote++; const i=S.remote.findIndex(x=>x.id===id);
    if(body===null){ if(i>=0) S.remote.splice(i,1); }
    else{ const t=Object.assign({id},body); if(i>=0) S.remote[i]=t; else S.remote.push(t); } };
  Promise.resolve(q).then(r=>{ if(r&&r.error) onWriteErr(r.error); else ok(); },onWriteErr).then(()=>{ inflight[id]=false; push(id); });
}
function writeTask(t){
  if(!db){
    const i=S.remote.findIndex(x=>x.id===t.id);
    if(i>=0) S.remote[i]=t; else S.remote.push(t);
    persistLocal(); merge(); render(); return;
  }
  const body=clone(t); delete body.id;
  over[t.id]=t; pending[t.id]=body; merge(); render(); push(t.id);
}
function removeTask(id){
  if(!db){ S.remote=S.remote.filter(x=>x.id!==id); persistLocal(); merge(); render(); return; }
  over[id]=null; pending[id]=null; merge(); render(); push(id);
}
let teamChain=Promise.resolve();
const teamDeletes=[];
function writeTeam(){
  if(!db){ teamDeletes.length=0; persistLocal(); render(); return; }
  const members=clone(S.team), dels=teamDeletes.splice(0);
  teamChain=teamChain.then(async()=>{
    if(members.length){ const r=await db.from('members').upsert(members); if(r.error) throw r.error; }
    if(dels.length){ const r=await db.from('members').delete().in('id',dels); if(r.error) throw r.error; }
  }).catch(onWriteErr);
  render();
}
const byId=id=>S.tasks.find(t=>t.id===id);
const nameOf=id=>{const m=S.team.find(m=>m.id===id);return m?m.name:'';};

async function boot(){

let refetchTimer=null, fetching=false, again=false, wrote=0;
const refetchSoon=()=>{ clearTimeout(refetchTimer); refetchTimer=setTimeout(fetchAll,250); };
// Uma leitura que começou antes de uma gravação terminar traria dados velhos: é descartada e refeita.
// Pedidos de leitura que chegam durante outra leitura também geram uma nova no final.
async function fetchAll(){
  if(fetching){ again=true; return; }
  fetching=true; again=false; const w=wrote;
  try{
    // Finanças e modelos vêm à parte: se a tabela ainda não existir no banco, as tarefas continuam funcionando.
    const soft=q=>Promise.resolve(q).catch(e=>({error:e}));
    const [a,b,c,m,o,pf]=await Promise.all([db.from('tasks').select('*'),db.from('members').select('*').order('created_at'),
      soft(db.from('finance').select('*')),soft(db.from('templates').select('*')),soft(db.from('offers').select('*').order('created_at')),
      soft(db.from('personal_finance').select('*'))]);
    if(a.error||b.error) throw (a.error||b.error);
    if(w===wrote&&!busyW){
      S.remote=a.data.map(fromRow); S.team=b.data.map(m=>({id:m.id,name:m.name}));
      S.finErr=!!c.error; if(!c.error) S.fin=c.data.map(finFrom);
      S.tplErr=!!m.error; if(!m.error) S.tpl=m.data.map(tplFrom);
      S.offerErr=!!o.error; if(!o.error) S.offers=o.data.map(offerFrom);
      S.pfinErr=!!pf.error; if(!pf.error) S.pfin=pf.data.map(pfFrom);
      S.ready=S.teamReady=true; merge(); render();
    }else again=true;
  }catch(e){ toast('Não foi possível carregar as tarefas. Confira a internet e recarregue a página.'); }
  fetching=false;
  if(again) fetchAll();
}

  const soon=refetchSoon;
  fetchAll();
  db.channel('pp').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},soon)
    .on('postgres_changes',{event:'*',schema:'public',table:'members'},soon)
    .on('postgres_changes',{event:'*',schema:'public',table:'finance'},soon)
    .on('postgres_changes',{event:'*',schema:'public',table:'templates'},soon)

/* ---------- datas e filtros ---------- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function dueInfo(t){
  if(!t.due) return null;
  const p=t.due.split('-').map(Number), label=p[2]+' '+MES[p[1]-1];
  if(t.status==='feito') return {label,cls:''};
  const now=new Date(), td=ymd(now); now.setDate(now.getDate()+1);
  if(t.due<td) return {label:'Atrasada · '+label,cls:'late'};
  if(t.due===td) return {label:'Hoje',cls:'today'};
  if(t.due===ymd(now)) return {label:'Amanhã',cls:''};
  return {label,cls:''};
}
const isLate=t=>!!t.due&&t.status!=='feito'&&t.due<ymd(new Date());
const person=()=>S.person||S.me;
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function addDays(s,n){ const p=s.split('-').map(Number), d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()+n); return ymd(d); }
function weekEnd(){ const d=new Date(); return addDays(ymd(d),(7-d.getDay())%7); }
function visible(){
  let ts;
  if(S.tab==='empresa'){
    ts=S.tasks.filter(t=>t.scope==='equipe');
    if(S.fWho) ts=ts.filter(t=>S.fWho==='_none'?!t.who:t.who===S.fWho);
  }else{
    const p=person();
    ts=S.tasks.filter(t=>t.scope==='pessoal'&&t.who===p);
  }
  if(S.fPrio) ts=ts.filter(t=>t.prio===S.fPrio);
  return ts.sort((a,b)=>PRIO[a.prio].o-PRIO[b.prio].o||(a.due||'9999').localeCompare(b.due||'9999')||a.createdAt-b.createdAt);
}

/* ---------- render ---------- */
function chips(t){
  const out=['<span class="chip p-'+t.prio+'">'+PRIO[t.prio].l+'</span>'];
  const d=dueInfo(t); if(d) out.push('<span class="chip '+d.cls+'">'+esc(d.label)+'</span>');
  if(S.tab==='empresa') out.push('<span class="chip">'+esc(nameOf(t.who)||'Sem responsável')+'</span>');
  return '<div class="chips">'+out.join('')+'</div>';
}
function progress(t){
  if(!t.steps.length) return '';
  const n=t.steps.filter(s=>s.done).length;
  return '<div class="prog"><div><i style="width:'+Math.round(n/t.steps.length*100)+'%"></i></div>'+n+'/'+t.steps.length+'</div>';
}
function cardHtml(t){
  const nx=t.status!=='feito'?t.steps.find(s=>!s.done):null;
  return '<article class="card'+(t.status==='feito'?' done':'')+'" draggable="true" tabindex="0" role="button" data-act="open" data-id="'+t.id+'">'+
    '<h3>'+esc(t.title)+'</h3>'+
    (nx?'<p class="next"><b>Próximo passo:</b> '+esc(nx.text)+'</p>':'')+progress(t)+chips(t)+'</article>';
}
let NB={};
function rowHtml(t){
  const open=S.expanded.has(t.id), done=t.status==='feito', nx=done?null:t.steps.find(s=>!s.done);
  const wk=S.period==='semana'&&!done, td=ymd(new Date()), nb=NB[t.id]||{};
  let h='<li class="row'+(done?' done':'')+'"'+(wk?' draggable="true" data-drag="'+t.id+'"':'')+'><div class="row-top">'+
    '<button class="tick" data-act="toggle-done" data-id="'+t.id+'" aria-label="'+(done?'Reabrir tarefa':'Concluir tarefa')+'">'+(done?'✓':'')+'</button>'+
    '<button class="row-main" data-act="open" data-id="'+t.id+'" title="Abrir a tarefa e ver as subtarefas"><span class="row-title">'+esc(t.title)+'</span>'+
    (nx&&!open?'<span class="next"><b>Próxima:</b> '+esc(nx.text)+'</span>':'')+chips(t)+progress(t)+'</button>'+
    (nb.up?'<button class="exp" data-act="move" data-id="'+t.id+'" data-to="'+nb.up+'" title="Fazer antes da tarefa de cima (mesmo dia e prioridade)">↑ Antes</button>':'')+
    (nb.down?'<button class="exp" data-act="move" data-id="'+t.id+'" data-to="'+nb.down+'" title="Fazer depois da tarefa de baixo (mesmo dia e prioridade)">Depois ↓</button>':'')+
    (!done&&t.due!==td?'<button class="exp today-btn" data-act="today" data-id="'+t.id+'" title="Mudar o prazo para hoje">Fazer hoje</button>':'')+
    (t.steps.length?'<button class="exp" data-act="expand" data-id="'+t.id+'" aria-expanded="'+open+'">Subtarefas '+(open?'▴':'▾')+'</button>':'')+'</div>';
  if(open&&t.steps.length){

  }
  return h+'</li>';

function opt(v,l,cur){return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(l)+'</option>';}
// Sem escolha salva, segue o tema do aparelho; o botão grava a escolha em pp_theme.
const isDark=()=>{ const t=document.documentElement.getAttribute('data-theme'); return t?t==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches); };
function renderBar(){

function render(){
  renderBar();
  const app=$('#app');

  if(S.section==='financas'){ renderFin(); askWho(); return; }
  const td=ymd(new Date()), sun=weekEnd(), mon=addDays(sun,-6);
  let ts=visible();
  if(S.period==='hoje') ts=ts.filter(t=>t.status==='feito'?t.due===td:t.due&&t.due<=td);
  else if(S.period==='semana') ts=ts.filter(t=>t.status==='feito'?t.due>=mon&&t.due<=sun:t.due&&t.due<=sun);

  if(S.tab==='empresa') h+='<label>Responsável <select id="flt-who" data-f="fWho">'+opt('','Todos',S.fWho)+people+opt('_none','Sem responsável',S.fWho)+'</select></label>';

  h+='<label>Prioridade <select id="flt-prio" data-f="fPrio">'+opt('','Todas',S.fPrio)+opt('alta','Alta',S.fPrio)+opt('media','Média',S.fPrio)+opt('baixa','Baixa',S.fPrio)+'</select></label>';

  const c=k=>ts.filter(t=>t.status===k).length, late=ts.filter(isLate).length;
  h+='<div class="stats"><span><b>'+c('afazer')+'</b> a fazer</span><span><b>'+c('feito')+'</b> feitas</span>'+
    (late?'<span class="late"><b>'+late+'</b> atrasada'+(late>1?'s':'')+'</span>':'')+'</div></div>';
  if(!ts.length){
    const filtered=S.fPrio||S.fWho||S.period!=='tudo';
    h+='<div class="empty"><h2>'+(S.period==='hoje'?'Nada com prazo até hoje':S.period==='semana'?'Nada com prazo até domingo':filtered?'Nada com esses filtros':S.tab==='empresa'?'Nenhuma tarefa da empresa ainda':'Nenhuma tarefa por aqui ainda')+'</h2>'+
      '<p>'+(S.period!=='tudo'?'Em "Tudo" você vê as demais tarefas e pode trazer qualquer uma para hoje.':filtered?'Mude os filtros acima para ver outras tarefas.':'Crie a primeira tarefa e quebre em subtarefas pequenas. Depois é só abrir e executar, uma de cada vez.')+'</p>'+
      (filtered?'':'<button class="btn primary" data-act="new">Criar a primeira tarefa</button>')+'</div>';
  }else{
    const open=ts.filter(t=>t.status!=='feito'), done=ts.filter(t=>t.status==='feito');
    // Vizinhas para "Antes"/"Depois": só tarefas abertas com a mesma prioridade e o mesmo prazo.
    NB={}; open.forEach((t,i)=>{ const same=x=>x&&x.prio===t.prio&&(x.due||'')===(t.due||'');
      NB[t.id]={up:same(open[i-1])?open[i-1].id:'',down:same(open[i+1])?open[i+1].id:''}; });
    if(S.period==='semana'){

        const p=d.split('-').map(Number), wd=DIAS[new Date(p[0],p[1]-1,p[2]).getDay()];
        h+=grp((d===td?'Hoje · ':'')+wd+', '+p[2]+' '+MES[p[1]-1],open.filter(t=>t.due===d),'Nada marcado.',d);

    if(done.length) h+='<h2 class="group">Concluídas ('+done.length+')</h2><ul class="list">'+done.map(rowHtml).join('')+'</ul>';
  }

// Gravação otimista simples: a tela muda na hora; se o banco recusar, avisa e relê tudo.
// Usada por finanças e modelos. Enquanto houver gravação em andamento (busyW), fetchAll não aplica leituras, para não trazer dados velhos.
let busyW=0;
function quickWrite(q){
  busyW++;
  Promise.resolve(q).then(r=>{ if(r&&r.error) throw r.error; }).catch(err=>{ onWriteErr(err); refetchSoon(); })
    .then(()=>{ busyW--; wrote++; });
}

function sumFin(l){ return l.reduce((a,e)=>a+e.cents,0); }
// Números de um conjunto de lançamentos: faturamento, anúncios, outros gastos e lucro.
function finStats(l){
  const rev=sumFin(l.filter(e=>e.kind==='receita')), ads=sumFin(l.filter(isAd)), other=sumFin(l.filter(e=>e.kind==='despesa'&&!isAd(e)));
  return {rev,ads,other,cost:ads+other,profit:rev-ads-other};

const signed=c=>(c>0?'+ ':c<0?'− ':'')+money(Math.abs(c));
const pn=c=>c<0?'neg':'pos';
function roas(s){ return s.ads?(s.rev/s.ads).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'x':'—'; }
const tile=(l,v,cls,sub)=>'<div class="tile"><span>'+l+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+v+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>';
// Período escolhido em Finanças (S.finPer): hoje, ontem, últimos 7 dias ou um mês (S.month).
// Devolve o intervalo de datas, o texto para frases ("hoje", "em novembro") e o período anterior para comparação.
function finRange(){
  const td=ymdNow(), y=addDays(td,-1);
  if(S.finPer==='hoje') return {from:td,to:td,txt:'hoje',prev:{from:y,to:y,name:'ontem'}};
  if(S.finPer==='ontem') return {from:y,to:y,txt:'ontem',prev:{from:addDays(td,-2),to:addDays(td,-2),name:'anteontem'}};
  if(S.finPer==='7d') return {from:addDays(td,-6),to:td,txt:'nos últimos 7 dias',prev:{from:addDays(td,-13),to:addDays(td,-7),name:'os 7 dias anteriores'}};
  // Mês: compara com o mês anterior no mesmo período; no mês corrente, só até o mesmo dia, para não comparar mês parcial com mês inteiro.
  const p=S.month.split('-').map(Number), last=String(new Date(p[0],p[1],0).getDate()), pm=addMonths(S.month,-1);
  const pp=pm.split('-').map(Number), plast=new Date(pp[0],pp[1],0).getDate(), cut=td.slice(0,7)===S.month?Math.min(+td.slice(8),plast):plast;
  return {from:S.month+'-01',to:S.month+'-'+last,txt:'em '+MESES[p[1]-1],month:true,
    prev:{from:pm+'-01',to:pm+'-'+String(cut).padStart(2,'0'),name:MESES[pp[1]-1]}};
}
const inRange=(d,r)=>d>=r.from&&d<=r.to;
const rangeDays=r=>{ const out=[]; for(let d=r.from;d<=r.to;d=addDays(d,1)) out.push(d); return out; };
const monthEntries=()=>{ const r=finRange(); return S.fin.filter(e=>inRange(e.date,r)); };
const dayTxt=d=>{ const p=d.split('-').map(Number); return p[2]+' de '+MES[p[1]-1]; };

    (S.finPer==='mes'?'<div class="seg month"><button data-act="month" data-d="-1" aria-label="Mês anterior">‹</button><span>'+monthLabel(S.month)+'</span><button data-act="month" data-d="1" aria-label="Próximo mês">›</button></div>'

    tile('ROI',roi,'','Lucro ÷ gastos totais')+

// Gráfico de lucro por dia do período. Em Hoje e Ontem (um dia só) não aparece: os quadros já dizem tudo.
function dailyChart(all){
  const r=finRange(), keys=rangeDays(r); if(keys.length<2) return '';
  const by={}; keys.forEach(k=>{ const l=all.filter(e=>e.date===k); by[k]=l.length?finStats(l):null; });
  const vals=keys.filter(k=>by[k]).map(k=>by[k].profit), up=Math.max(0,...vals), down=Math.max(0,...vals.map(v=>-v)), span=(up+down)||1, zero=down/span*100;
  const withData=keys.filter(k=>by[k]), pick=by[S.dayPick]?S.dayPick:withData[withData.length-1], x=by[pick];
  const bars=keys.map((k,i)=>{
    const v=by[k], d=+k.slice(8), lab=!r.month||d===1||d%7===1&&d<29||i===keys.length-1?'<em>'+d+'</em>':'';

const tplFrom=r=>({id:r.id,kind:r.kind||'tarefa',name:r.name||'',data:r.data||{},createdAt:Number(r.created_at)||0,createdBy:r.created_by||''});

function saveTpl(t){
  const i=S.tpl.findIndex(x=>x.id===t.id); if(i>=0) S.tpl[i]=t; else S.tpl.push(t);

}
function tplFromTask(t,id){
  return {id:id||uid('m'),kind:'tarefa',name:t.title.trim(),createdAt:Date.now(),createdBy:S.me,
    data:{desc:t.desc||'',prio:t.prio,who:t.who||'',steps:t.steps.map(s=>s.text.trim()).filter(Boolean)}};
}
// Aplica um modelo ao rascunho de uma tarefa nova: título (se vazio), subtarefas, prioridade, responsável e observações.
function useTpl(id){
  const m=S.tpl.find(x=>x.id===id), d=S.draft; if(!m||!d||d.fromTpl===id) return;
  const x=m.data||{};
  if(!d.title.trim()) d.title=m.name;
  (x.steps||[]).forEach(text=>d.steps.push({id:uid('s'),text,done:false}));
  if(PRIO[x.prio]) d.prio=x.prio;
  if(x.who&&S.team.some(p=>p.id===x.who)) d.who=x.who;
  if(!d.desc.trim()&&x.desc) d.desc=x.desc;
  d.fromTpl=id;

}

// Ao ticar subtarefas: todas feitas conclui a tarefa; desmarcar uma reabre a tarefa.
function autoDone(t){
  if(!t.steps.length) return;
  const all=t.steps.every(s=>s.done);
  if(all&&t.status!=='feito'){ t.status='feito'; toast('Todas as subtarefas feitas: tarefa concluída.'); }
  else if(!all&&t.status==='feito') t.status='afazer';
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{el.hidden=true;},4500); }

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){ S[t.dataset.f]=t.value; render(); return; }
  if(t.id==='e-offer'){ readEntry(); renderEntry(); return; }

    const task=byId(t.dataset.id); if(!task) return;
    const n=clone(task), s=n.steps.find(s=>s.id===t.dataset.step); if(!s) return;

  if(e.target.id!=='addMember') return;
  e.preventDefault();
  const inp=$('#f-member'), name=inp.value.trim(); if(!name) return;
  const m={id:uid('m'),name:name.slice(0,40)};
  S.team=S.team.concat([m]); inp.value='';
  if(!S.me||!S.team.some(x=>x.id===S.me)){ S.me=m.id; ls.set('pp_me',m.id); S.teamOpen=true; }
  writeTeam();
});
/* arrastar cartões entre colunas */
let dragId=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.row[data-drag]'); if(!c) return; dragId=c.dataset.drag; try{e.dataTransfer.setData('text/plain',dragId); e.dataTransfer.effectAllowed='move';}catch(x){} });
document.addEventListener('dragover',e=>{ const c=dragId&&e.target.closest&&e.target.closest('.day[data-day]'); if(!c) return; e.preventDefault(); c.classList.add('over'); });
document.addEventListener('dragleave',e=>{ const c=e.target.closest&&e.target.closest('.day[data-day]'); if(c&&!c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop',e=>{
  const c=dragId&&e.target.closest&&e.target.closest('.day[data-day]'); if(!c) return; e.preventDefault(); c.classList.remove('over');
  const t=byId(dragId); dragId=null;
  if(t&&t.due!==c.dataset.day) writeTask(Object.assign(clone(t),{due:c.dataset.day}));
});
document.addEventListener('dragend',()=>{ dragId=null; });

boot();
})();
</script>
